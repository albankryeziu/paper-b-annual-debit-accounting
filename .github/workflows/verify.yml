name: Verify final implementation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify bytes and syntax without numerical execution
        run: python RUN_PAPERB.py
      - name: Install mathematical test dependencies
        run: python -m pip install -e ".[test]"
      - name: Test debit laws, exposure ceilings and chronological balances
        run: python -m pytest tests -q
