[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpwrs-compact"
version = "3.3.0"
description = "Auditable annual non-firm entitlement accounting; local scientific qualification required"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.11", "scikit-learn>=1.3", "joblib>=1.3", "psutil>=5.8", "matplotlib>=3.5"]

[project.optional-dependencies]
production = ["gurobipy>=12,<13", "pandapower>=3.2,<4", "pyarrow>=10"]
test = ["pytest>=6.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tpwrs*", "jobs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
